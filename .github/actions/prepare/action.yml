name: Prepare application toolchain
description: Locked JS dependencies and the pinned Valdi fork sources
outputs:
  toolchain:
    description: OS, architecture, Xcode SDK and native build tool digest
    value: ${{ steps.toolchain.outputs.key }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6; packageManager in package.json
      with:
        run_install: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '24'
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          valdi/pnpm-lock.yaml
          tools/valdi-rolldown/pnpm-lock.yaml
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        distribution: temurin
        java-version: '17'
    - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
      with:
        module-root: valdi
        bazelisk-cache: true
        repository-cache: true
    - name: Install locked dependencies and prepare sources
      shell: bash
      run: |
        mkdir -p .ci
        pnpm install --frozen-lockfile
        echo "BAZEL_BIN=$(command -v bazelisk)" >> "$GITHUB_ENV"
        BAZEL_BIN="$(command -v bazelisk)" node scripts/prepare-valdi.mjs 2>&1 | tee .ci/prepare.log
        node scripts/upstream.mjs report .ci/upstream
    - name: Identify native toolchain
      id: toolchain
      shell: bash
      run: node scripts/ci.mjs toolchain
