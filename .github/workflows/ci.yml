name: Application CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      valdi_commit:
        description: 'Optional 40-character Valdi fork commit to try (empty = committed pin)'
        type: string
        default: ''
      widgets_tag:
        description: 'Optional Widgets tag, only used with valdi_commit'
        type: string
        default: ''

permissions:
  contents: read

env:
  VALDI_BAZEL_ARGS: '--experimental_disk_cache_gc_max_size=3G'

concurrency:
  group: app-ci-${{ github.event_name }}-${{ github.ref }}-${{ inputs.valdi_commit || 'pinned' }}
  # Let a cold native build finish and populate caches; retain only the newest queued revision.
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    # The iOS vision simulator slice is arm64. Keep host tools on the same supported macOS image.
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [npm, android, ios]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select framework fork commit
        if: inputs.valdi_commit != ''
        env:
          VALDI_COMMIT: ${{ inputs.valdi_commit }}
          WIDGETS_TAG: ${{ inputs.widgets_tag }}
        run: |
          args=("$VALDI_COMMIT")
          if [[ -n "$WIDGETS_TAG" ]]; then args+=("$WIDGETS_TAG"); fi
          node scripts/upstream.mjs pin "${args[@]}"
      - uses: ./.github/actions/prepare
        id: prepare
      - name: Golden and build prerequisite tests
        run: pnpm test 2>&1 | tee .ci/test.log
      - name: Set up Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Install XcodeGen
        if: matrix.target == 'ios'
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Restore Bazel action cache
        id: bazel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel-disk-cache
          key: bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.toolchain }}-${{ matrix.target }}-${{ hashFiles('valdi/.bazelversion') }}-${{ github.sha }}-${{ inputs.valdi_commit || 'pinned' }}
          restore-keys: |
            bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.toolchain }}-${{ matrix.target }}-${{ hashFiles('valdi/.bazelversion') }}-
      - name: Runtime fingerprint
        if: matrix.target != 'npm'
        id: runtime-input
        run: node scripts/ci.mjs runtime-key "${{ matrix.target }}"
      - name: Restore exported runtime
        if: matrix.target != 'npm'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            android/app/libs/valdi_runtime.aar
            android/app/libs/valdi_ota.json
            ios/Frameworks/ValdiRuntime.xcframework
            ios/Frameworks/valdi_ota.json
          key: runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.toolchain }}-${{ matrix.target }}-debug-${{ steps.runtime-input.outputs.key }}-${{ hashFiles('scripts/export-*.sh', 'valdi/pnpm-lock.yaml', 'valdi/patches/**') }}
      - name: Validate cached runtime
        if: matrix.target != 'npm'
        id: runtime
        run: node scripts/ci.mjs runtime-valid "${{ matrix.target }}"
      - name: Export runtime on cache miss or fingerprint mismatch
        if: matrix.target != 'npm' && steps.runtime.outputs.valid != 'true'
        run: sh "scripts/export-${{ matrix.target }}.sh" debug 2>&1 | tee .ci/export.log
      - name: Final runtime fingerprint
        if: matrix.target != 'npm'
        id: runtime-output
        run: node scripts/ci.mjs runtime-key "${{ matrix.target }}"
      - name: Save matching runtime
        if: matrix.target != 'npm' && steps.runtime.outputs.valid != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            android/app/libs/valdi_runtime.aar
            android/app/libs/valdi_ota.json
            ios/Frameworks/ValdiRuntime.xcframework
            ios/Frameworks/valdi_ota.json
          key: runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.toolchain }}-${{ matrix.target }}-debug-${{ steps.runtime-output.outputs.key }}-${{ hashFiles('scripts/export-*.sh', 'valdi/pnpm-lock.yaml', 'valdi/patches/**') }}
      - name: Save Bazel action cache
        if: always() && !cancelled() && steps.bazel-cache.outcome == 'success' && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel-disk-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
      - name: Build application modules
        if: matrix.target == 'npm'
        run: pnpm build 2>&1 | tee .ci/build.log
      - name: Restore vision dependencies
        if: matrix.target != 'npm'
        id: vision
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vision/vendor/install
          key: vision-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.toolchain }}-${{ matrix.target }}-ndk27.1.12297006-${{ hashFiles('vision/vendor-lock.json', 'vision/scripts/prepare-native.cjs') }}
      - name: Build vision dependencies
        if: matrix.target != 'npm' && steps.vision.outputs.cache-hit != 'true'
        env:
          VISION_TARGET: ${{ matrix.target == 'android' && 'android-arm64' || 'ios' }}
        run: node vision/scripts/prepare-native.cjs --target "$VISION_TARGET" 2>&1 | tee .ci/vision.log
      - name: Save prepared vision dependencies
        if: matrix.target != 'npm' && steps.vision.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vision/vendor/install
          key: ${{ steps.vision.outputs.cache-primary-key }}
      - name: Build Android debug APK
        if: matrix.target == 'android'
        run: pnpm build:android --no-daemon --stacktrace 2>&1 | tee .ci/build.log
      - name: Build iOS simulator app
        if: matrix.target == 'ios'
        run: |
          pnpm build:ios 2>&1 | tee .ci/build.log
          tar -czf .ci/ValdiRoutes-simulator.tar.gz -C ios/build/Build/Products/Debug-iphonesimulator ValdiRoutes.app
      - name: Capture upgrade inputs and source review
        if: always()
        run: |
          mkdir -p .ci
          git diff -- valdi/MODULE.bazel valdi/MODULE.bazel.lock valdi/.bazelrc > .ci/upstream-pin.diff
          if [[ -f .ci/upstream/vendor.md ]]; then cat .ci/upstream/vendor.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload build evidence
        if: always()
        id: artifacts
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-${{ matrix.target }}-${{ github.run_id }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .ci/
            android/app/build/outputs/apk/debug/*.apk
      - name: Report unavailable artifacts
        if: always() && steps.artifacts.outcome == 'failure'
        run: |
          echo '::warning::Build evidence upload failed. See the upload step for the storage/quota error; test and build results remain independent.'
          echo 'Artifact upload failed. Logs remain available in the workflow; downloadable APK/App/report artifacts are unavailable for this job. Check the upload step and account storage quota.' >> "$GITHUB_STEP_SUMMARY"

  windows-android:
    name: Windows native Android
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          module-root: valdi
          bazelisk-cache: true
          repository-cache: true
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Install dependencies and fetch the exact fork checkout
        env:
          REQUESTED_VALDI_COMMIT: ${{ inputs.valdi_commit }}
          REQUESTED_WIDGETS_TAG: ${{ inputs.widgets_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .ci | Out-Null
          if ($env:REQUESTED_VALDI_COMMIT) {
            $pinArgs = @('scripts/upstream.mjs', 'pin', $env:REQUESTED_VALDI_COMMIT)
            if ($env:REQUESTED_WIDGETS_TAG) { $pinArgs += $env:REQUESTED_WIDGETS_TAG }
            & node @pinArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $module = Get-Content valdi/MODULE.bazel -Raw
          $commit = [regex]::Match($module, '(?m)^VALDI_COMMIT = "([0-9a-f]{40})"').Groups[1].Value
          $repo = [regex]::Match($module, '(?m)^VALDI_REPOSITORY = "([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)"').Groups[1].Value
          if (-not $commit -or -not $repo) { throw 'Missing immutable fork pin' }
          # Use the supported clean-checkout path, without machine-specific archive caches.
          $fork = Join-Path $env:RUNNER_TEMP 'valdi-fork'
          git init $fork
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $fork remote add origin "https://github.com/$repo.git"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $fork -c core.autocrlf=false fetch --depth=1 origin $commit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $fork -c core.autocrlf=false checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VALDI_CHECKOUT=$fork" >> $env:GITHUB_ENV
          $bazel = (Get-Command bazelisk).Source
          "BAZEL_BIN=$bazel" >> $env:GITHUB_ENV
          # Direct Node children need pnpm's JS launcher, rather than its .cmd shim.
          $pnpmLauncher = pnpm exec node -p 'process.env.npm_execpath'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $pnpmLauncher)) { throw 'Cannot resolve pnpm JS launcher' }
          "npm_execpath=$pnpmLauncher" >> $env:GITHUB_ENV
      - name: Test Windows entry point helpers
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/test-windows-build.ps1 -Integration -BazelPath $env:BAZEL_BIN 2>&1 | Tee-Object .ci/windows-tests.log
          exit $LASTEXITCODE
      - name: Export runtime, build native modules and package APK
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/build-android.ps1 -ValdiCheckout $env:VALDI_CHECKOUT -BazelPath $env:BAZEL_BIN -JavaHome $env:JAVA_HOME -AndroidHome $env:ANDROID_HOME -BazelArgs 'build --experimental_disk_cache_gc_max_size=3G' 2>&1 | Tee-Object .ci/windows-build.log
          exit $LASTEXITCODE
      - name: Test pipeline and validate runtime fingerprint
        run: |
          pnpm test 2>&1 | Tee-Object .ci/test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ota.mjs check-export android android/app/libs/valdi_ota.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash android/app/libs/valdi_runtime.aar, module-build/out/android/calculator/calculator_android.jar, android/app/build/outputs/apk/debug/app-debug.apk | Format-List | Out-File .ci/windows-artifacts.txt
      - name: Audit runtime compilation actions
        run: |
          Push-Location valdi
          & $env:BAZEL_BIN aquery 'deps(//:valdi_runtime_android)' --config=stable_exec --repo_env=VALDI_PLATFORM_DEPENDENCIES=android --output=jsonproto --noinclude_artifacts --noinclude_commandline > ../.ci/windows-actions.json
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit $code }
          node scripts/verify-runtime-actions.mjs .ci/windows-actions.json
          exit $LASTEXITCODE
      - name: Upload Windows build evidence and APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-windows-android-${{ github.run_id }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .ci/
            android/app/build/outputs/apk/debug/*.apk
