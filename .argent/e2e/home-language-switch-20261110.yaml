# The Follow system assertion expects a device whose default locale resolves to Chinese.
steps:
  - echo: Launch Home; expect the language controls.
  - launch: io.valdiroutes.app
  - await: { visible: { id: language-greeting }, timeout: 10000 }
  - await: { idle: true }
  - echo: Select English; expect Hello, Valdi.
  - tap:
      text: English
  - await: { text: { in: { id: language-greeting }, equals: "Hello, Valdi" } }
  - echo: Select 简体中文; expect 你好，Valdi.
  - tap:
      text: 简体中文
  - await: { text: { in: { id: language-greeting }, equals: "你好，Valdi" } }
  - echo: Select English again before restoring the simulator's default Chinese
      locale.
  - tap:
      text: English
  - await: { text: { in: { id: language-greeting }, equals: "Hello, Valdi" } }
  - echo: Follow system; on a Chinese-locale simulator expect 你好，Valdi.
  - tap:
      text: Follow system
  - await: { text: { in: { id: language-greeting }, equals: "你好，Valdi" } }
