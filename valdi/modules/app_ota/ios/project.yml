# Included for selected app_ota builds by Generated/Modules.yml.
# Source paths are relative to this file; SRCROOT in scripts/settings remains the host ios/ directory.
targets:
  ValdiOtaCodec:
    type: library.static
    platform: iOS
    sources:
      - path: ../native/CodecIO.c
      - path: ../native/ValdiOtaZstd.c
      - path: ../native/ValdiOtaHdiff.c
      - path: ../native/vendor/zstd/lib/common
        includes: ["*.c"]
      - path: ../native/vendor/zstd/lib/compress
        includes: ["*.c"]
      - path: ../native/vendor/zstd/lib/decompress
        includes: ["*.c"]
      - path: ../native/vendor/hdiffpatch/libHDiffPatch/HPatch/patch.c
    settings:
      base:
        SKIP_INSTALL: YES
        GCC_SYMBOLS_PRIVATE_EXTERN: YES
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - NDEBUG=1
          - DEBUGLEVEL=0
          - ZSTD_DISABLE_ASM=1
          - ZSTD_LEGACY_SUPPORT=0
          - _POSIX_C_SOURCE=200809L
          - _DARWIN_C_SOURCE=1
          - _IS_USED_MULTITHREAD=0
          - _HPATCH_IS_USED_MULTITHREAD=0
          - _IS_NEED_DIR_DIFF_PATCH=0
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../valdi/modules/app_ota/native
  ${VALDI_APP_NAME}:
    dependencies:
      - target: ValdiOtaCodec
        embed: false
    postCompileScripts:
      # Manual OTA target version, application-module inventory, static base URL and public signing key.
      # Debug always uses bundled modules; native compatibility is managed by the publisher.
      - name: Valdi over-the-air info
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          command -v node >/dev/null || . "$HOME/.nvm/nvm.sh"
          update_url=""
          if [ "$CONFIGURATION" = "Release" ]; then update_url="$VALDI_OTA_URL"; fi
          node "$SRCROOT/../scripts/ota.mjs" app-info ios "$SRCROOT/Frameworks/valdi_ota.json" "$MARKETING_VERSION" \
            "$update_url" > "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/valdi_ota.json"
