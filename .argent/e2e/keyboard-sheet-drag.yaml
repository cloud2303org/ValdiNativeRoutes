steps:
  - run: home
  - scroll-to: { target: { text: "showToast 成功" } }
  - scroll-to: { target: { text: "Sheet + 普通 view + 输入框" } }
  - scroll-to: { target: { text: "Sheet + scroll + 输入框" } }
  - tap: { text: "Sheet + scroll + 输入框" }
  - await: { visible: { text: "Sheet 里的长表单" } }
  # Scroll the content first: the sheet must stay put while the content scrolls.
  - swipe: up
  - await: { idle: true }
  - swipe: down
  - swipe: { direction: down, momentum: false }
  # The home page's result line sits under its first button; scrolling up to a changing text is flaky on iOS.
  - scroll-to: { target: { text: "push 详情页" }, direction: up }
  - await: { visible: { text: "结果：表单取消了" } }
