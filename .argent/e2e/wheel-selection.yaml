steps:
  - run: home
  - scroll-to: { target: { text: "showToast 成功" } }
  - scroll-to: { target: { text: "页面内滚轮（组件）" } }
  - tap: { text: "页面内滚轮（组件）" }
  - await: { visible: { text: "采样位置：进水口" } }
  - await: { idle: true }
  - when: { platform: ios }
    steps:
      - swipe: { direction: up, from: { text: "进水口" }, momentum: false, duration: 600 }
      - await: { visible: { text: "采样位置：污泥池" } }
  # Android: the wheel's rows aren't in the runner tree, so its selected row is a point (between the 采样位置 and 采样日期
  # labels), moved one row.
  - when: { platform: android }
    steps:
      - swipe: { from: { x: 0.5, y: 0.28 }, by: { y: -0.045 }, momentum: false, duration: 600 }
      - await: { visible: { text: "采样位置：出水口" } }
  # Only that wheel moved.
  - assert: { visible: { text: "地区：浙江 / 杭州 / 西湖" } }
