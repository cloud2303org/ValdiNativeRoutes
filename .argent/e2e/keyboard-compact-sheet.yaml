steps:
  - run: home
  - scroll-to: { target: { text: "showToast 成功" } }
  - scroll-to: { target: { text: "Sheet + 普通 view + 输入框" } }
  - tap: { text: "Sheet + 普通 view + 输入框" }
  - await: { visible: { text: "发送" } }
  - tap: { role: TextField }
  - when: { platform: android }
    steps:
      - await: { visible: { text: "Shift" } }
  # Typed, not pasted: paste isn't available on a TCP-connected Android device and doesn't reliably land on iOS.
  - type: { into: { role: TextField }, text: "hi", submit: false }
  - tap: { text: "发送" }
  # The home page's result line sits under its first button; scrolling up to a changing text is flaky on iOS.
  - scroll-to: { target: { text: "push 详情页" }, direction: up }
  - await: { visible: { text: "结果：表单提交了 1 项" } }
