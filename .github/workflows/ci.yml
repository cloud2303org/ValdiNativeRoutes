name: Application CI

on:
  push:
    branches:
      - '**' # Tag pushes use release.yml; the same commit is tested on its branch.
  pull_request:
  workflow_dispatch:
    inputs:
      valdi_commit:
        description: 'Optional 40-character Valdi fork commit to try (empty = committed pin)'
        type: string
        default: ''
      widgets_tag:
        description: 'Optional Widgets tag, only used with valdi_commit'
        type: string
        default: ''

permissions:
  contents: read

env:
  VALDI_BAZEL_ARGS: '--experimental_disk_cache_gc_max_size=3G'

concurrency:
  group: app-ci-${{ github.event_name }}-${{ github.ref }}-${{ inputs.valdi_commit || 'pinned' }}
  # Let a cold native build finish and populate caches; retain only the newest queued revision.
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-android
            target: android
            runner: macos-26
          # The iOS Vision simulator slice requires an arm64 macOS host.
          - name: macos-ios
            target: ios
            runner: macos-26
          - name: linux-android
            target: android
            runner: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare Linux runner storage
        if: runner.os == 'Linux'
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          mkdir -p .ci
          bash scripts/ci-linux-disk.sh prepare 2>&1 | tee .ci/disk-prepare.log
      - name: Select framework fork commit
        if: inputs.valdi_commit != ''
        env:
          VALDI_COMMIT: ${{ inputs.valdi_commit }}
          WIDGETS_TAG: ${{ inputs.widgets_tag }}
        run: |
          args=("$VALDI_COMMIT")
          if [[ -n "$WIDGETS_TAG" ]]; then args+=("$WIDGETS_TAG"); fi
          node scripts/upstream.mjs pin "${args[@]}"
      - uses: ./.github/actions/prepare
        id: prepare
      - name: Golden and build prerequisite tests
        run: |
          pnpm test 2>&1 | tee .ci/test.log
      - name: Set up Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006 ndk;28.0.13004108 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Install XcodeGen
        if: matrix.target == 'ios'
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Restore Bazel action cache
        id: bazel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel-disk-cache
          key: bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.toolchain }}-${{ matrix.target }}-${{ hashFiles('valdi/.bazelversion') }}-${{ github.sha }}-${{ inputs.valdi_commit || 'pinned' }}
          restore-keys: |
            bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.toolchain }}-${{ matrix.target }}-${{ hashFiles('valdi/.bazelversion') }}-
      - name: Report Linux storage after cache restoration
        if: runner.os == 'Linux'
        run: bash scripts/ci-linux-disk.sh report 2>&1 | tee .ci/disk-before-export.log
      - name: Restore vision dependencies
        if: matrix.target != 'npm'
        id: vision
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vision/vendor/install
          key: vision-static-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.toolchain }}-${{ matrix.target }}-${{ hashFiles('vision/vendor-lock.json', 'vision/*-runtime.json', 'vision/scripts/**', 'vision/patches/**') }}
      # Runtime export is an explicit CI operation. Bazel retains its action cache;
      # app builds never decide whether to re-export from runtime source hashes.
      - name: Export runtime
        run: sh "scripts/export-${{ matrix.target }}.sh" debug 2>&1 | tee .ci/export.log
      - name: Verify wheels against the exported runtime
        working-directory: tools/valdi-rolldown
        env:
          WHEEL_RUNTIME: ${{ matrix.target }}
        run: node node_modules/tsx/dist/cli.mjs --test wheel-platform-compat.test.ts 2>&1 | tee ../../.ci/wheel-runtime.log
      - name: Save Bazel action cache
        if: always() && !cancelled() && steps.bazel-cache.outcome == 'success' && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel-disk-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
      - name: Typecheck generated Swift against the exported runtime
        if: matrix.target == 'ios'
        working-directory: tools/valdi-rolldown
        env:
          VALDI_SWIFT_TYPECHECK: '1'
        run: node node_modules/tsx/dist/cli.mjs --test swift.test.ts 2>&1 | tee ../../.ci/swift-typecheck.log
      - name: Build Android debug APK
        if: matrix.target == 'android'
        run: pnpm build:android --no-daemon --stacktrace 2>&1 | tee .ci/build.log
      - name: Build iOS simulator app
        if: matrix.target == 'ios'
        run: |
          pnpm build:ios 2>&1 | tee .ci/build.log
          app_name=$(node --input-type=module -e 'import { readAppConfig } from "./scripts/app-config.mjs"; console.log(readAppConfig().name)')
          tar -czf .ci/ios-simulator.tar.gz -C ios/build/Build/Products/Debug-iphonesimulator "$app_name.app"
      - name: Save prepared vision dependencies
        # Explicit runtime export prepares cpp dependencies; app builds prepare host dependencies.
        if: always() && steps.vision.outputs.cache-hit != 'true' && hashFiles('vision/vendor/install/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vision/vendor/install
          key: ${{ steps.vision.outputs.cache-primary-key }}
      - name: Capture upgrade inputs and source review
        if: always()
        run: |
          mkdir -p .ci
          git diff -- valdi/MODULE.bazel valdi/MODULE.bazel.lock valdi/.bazelrc > .ci/upstream-pin.diff
          if [[ -f .ci/upstream/vendor.md ]]; then cat .ci/upstream/vendor.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Report final Linux storage
        if: always() && runner.os == 'Linux'
        run: bash scripts/ci-linux-disk.sh report 2>&1 | tee .ci/disk-final.log
      - name: Upload build evidence
        if: always()
        id: artifacts
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-${{ matrix.name }}-${{ github.run_id }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .ci/
            android/app/build/outputs/apk/debug/*.apk
      - name: Report unavailable artifacts
        if: always() && steps.artifacts.outcome == 'failure'
        run: |
          echo '::warning::Build evidence upload failed. See the upload step for the storage/quota error; test and build results remain independent.'
          echo 'Artifact upload failed. Logs remain available in the workflow; downloadable APK/App/report artifacts are unavailable for this job. Check the upload step and account storage quota.' >> "$GITHUB_STEP_SUMMARY"
