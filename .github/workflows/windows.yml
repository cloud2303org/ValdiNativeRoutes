name: Windows Android CI

on:
  push:
    branches: [hermes-v1]
  workflow_dispatch:
    inputs:
      valdi_commit:
        description: Optional immutable Valdi fork commit
        type: string
        default: ''
      widgets_tag:
        description: Optional Widgets tag when overriding Valdi
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-android:
    name: Windows native Android
    # A public repository must not run untrusted PR code on the personal PC.
    if: github.repository == 'cloud2303org/ValdiNativeRoutes' && github.ref == 'refs/heads/hermes-v1' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Windows, X64, valdi-windows]
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Configure optional GitHub Git proxy for this job
        env:
          WINDOWS_GIT_PROXY_URL: ${{ vars.WINDOWS_GIT_PROXY_URL }}
        run: |
          if ($env:WINDOWS_GIT_PROXY_URL) {
            'GIT_CONFIG_COUNT=1' >> $env:GITHUB_ENV
            'GIT_CONFIG_KEY_0=http.https://github.com/.proxy' >> $env:GITHUB_ENV
            "GIT_CONFIG_VALUE_0=$env:WINDOWS_GIT_PROXY_URL" >> $env:GITHUB_ENV
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify the shared Bazel disk cache is writable
        # The cache is shared with local builds. If an elevated shell creates it with a
        # protected DACL that omits the runner account, Bazel stops with only the cache
        # path in its message ("Error initializing RemoteModule"), so fail here instead.
        run: |
          $option = [regex]::Match((Get-Content valdi/.bazelrc -Raw), '(?m)^build --disk_cache=(.+)$')
          if (-not $option.Success) { throw 'valdi/.bazelrc does not configure a Bazel disk cache' }
          $cache = $option.Groups[1].Value.Trim()
          if ($cache.StartsWith('~/')) { $cache = Join-Path $env:USERPROFILE $cache.Substring(2) }
          $cache = $cache -replace '/', '\'
          $account = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          try {
            New-Item -ItemType Directory -Force -Path $cache -ErrorAction Stop | Out-Null
            $probe = Join-Path $cache "writable-$([guid]::NewGuid().ToString('N'))"
            Set-Content -LiteralPath $probe -Value 'probe' -NoNewline -ErrorAction Stop
            Remove-Item -LiteralPath $probe -Force -ErrorAction Stop
          } catch {
            throw "Bazel disk cache '$cache' is not writable by $account ($($_.Exception.Message)). Grant the runner account modify rights, for example: icacls `"$cache`" /grant `"${account}:(OI)(CI)M`""
          }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use the installed pnpm launcher at the pinned version
        run: |
          $expected = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager -replace '^pnpm@', ''
          $pnpmHome = Split-Path (Get-Command pnpm).Source
          $candidates = @(
            (Join-Path $pnpmHome 'node_modules/corepack/dist/pnpm.js'),
            (Join-Path $pnpmHome 'node_modules/pnpm/bin/pnpm.cjs')
          )
          $launcher = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $launcher) { throw 'Install Corepack or pnpm with its JS launcher on this runner' }
          $actual = & node $launcher --version
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -ne $expected) { throw "Expected pnpm $expected, got $actual" }
          "npm_execpath=$launcher" >> $env:GITHUB_ENV
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Install dependencies and fetch the exact fork checkout
        env:
          REQUESTED_VALDI_COMMIT: ${{ inputs.valdi_commit }}
          REQUESTED_WIDGETS_TAG: ${{ inputs.widgets_tag }}
          WINDOWS_BAZEL_PATH: ${{ vars.WINDOWS_BAZEL_PATH }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .ci | Out-Null
          if ($env:REQUESTED_VALDI_COMMIT) {
            $pinArgs = @('scripts/upstream.mjs', 'pin', $env:REQUESTED_VALDI_COMMIT)
            if ($env:REQUESTED_WIDGETS_TAG) { $pinArgs += $env:REQUESTED_WIDGETS_TAG }
            & node @pinArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $module = Get-Content valdi/MODULE.bazel -Raw
          $commit = [regex]::Match($module, '(?m)^VALDI_COMMIT = "([0-9a-f]{40})"').Groups[1].Value
          $repo = [regex]::Match($module, '(?m)^VALDI_REPOSITORY = "([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)"').Groups[1].Value
          if (-not $commit -or -not $repo) { throw 'Missing immutable fork pin' }
          # Use the supported clean-checkout path, without machine-specific archive caches.
          $fork = Join-Path $env:RUNNER_TEMP 'valdi-fork'
          if (Test-Path $fork) { Remove-Item -LiteralPath $fork -Recurse -Force }
          git init $fork
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $fork remote add origin "https://github.com/$repo.git"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The local proxy occasionally resets a connection; retry the fetch a few times
          # instead of failing the whole build on one reset.
          $fetched = $false
          foreach ($attempt in 1..3) {
            git -C $fork -c core.autocrlf=false fetch --depth=1 origin $commit
            if ($LASTEXITCODE -eq 0) { $fetched = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $fetched) { throw "Failed to fetch $repo at $commit after 3 attempts" }
          git -C $fork -c core.autocrlf=false checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VALDI_CHECKOUT=$fork" >> $env:GITHUB_ENV
          if ($env:WINDOWS_BAZEL_PATH) {
            if (-not (Test-Path -LiteralPath $env:WINDOWS_BAZEL_PATH -PathType Leaf)) { throw 'WINDOWS_BAZEL_PATH does not exist' }
            $bazel = (Resolve-Path -LiteralPath $env:WINDOWS_BAZEL_PATH).Path
          } else {
            $bazelCommand = Get-Command bazel -ErrorAction SilentlyContinue
            if (-not $bazelCommand) { $bazelCommand = Get-Command bazelisk -ErrorAction Stop }
            $bazel = $bazelCommand.Source
          }
          Push-Location valdi
          $version = & $bazel --version
          $code = $LASTEXITCODE
          Pop-Location
          $expected = (Get-Content valdi/.bazelversion -Raw).Trim()
          if ($code -ne 0 -or $version.Trim() -ne "bazel $expected") { throw "Expected Bazel $expected, got $version" }
          "BAZEL_BIN=$bazel" >> $env:GITHUB_ENV
      - name: Test Windows entry point helpers
        env:
          # Bazel's repository downloader reads these instead of Git's http.proxy; the
          # runner has no direct egress, so reuse the same local proxy and keep local
          # addresses direct.
          HTTPS_PROXY: ${{ vars.WINDOWS_GIT_PROXY_URL }}
          HTTP_PROXY: ${{ vars.WINDOWS_GIT_PROXY_URL }}
          NO_PROXY: localhost,127.0.0.1
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/test-windows-build.ps1 -Integration -BazelPath $env:BAZEL_BIN 2>&1 | Tee-Object .ci/windows-tests.log
          exit $LASTEXITCODE
      - name: Export runtime, build native modules and package APK
        env:
          # See the helper step: repository downloads such as rules_license otherwise time
          # out with "Connect timed out" while Git fetches already succeed through the proxy.
          HTTPS_PROXY: ${{ vars.WINDOWS_GIT_PROXY_URL }}
          HTTP_PROXY: ${{ vars.WINDOWS_GIT_PROXY_URL }}
          NO_PROXY: localhost,127.0.0.1
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/build-android.ps1 -ValdiCheckout $env:VALDI_CHECKOUT -BazelPath $env:BAZEL_BIN -JavaHome $env:JAVA_HOME -AndroidHome $env:ANDROID_HOME -BazelArgs 'build --experimental_disk_cache_gc_max_size=3G' 2>&1 | Tee-Object .ci/windows-build.log
          exit $LASTEXITCODE
      - name: Test pipeline and validate runtime fingerprint
        run: |
          pnpm test 2>&1 | Tee-Object .ci/test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ota.mjs check-export android android/app/libs/valdi_ota.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash android/app/libs/valdi_runtime.aar, module-build/out/android/calculator/calculator_android.jar, android/app/build/outputs/apk/debug/app-debug.apk | Format-List | Out-File .ci/windows-artifacts.txt
      - name: Audit runtime compilation actions
        env:
          HTTPS_PROXY: ${{ vars.WINDOWS_GIT_PROXY_URL }}
          HTTP_PROXY: ${{ vars.WINDOWS_GIT_PROXY_URL }}
          NO_PROXY: localhost,127.0.0.1
        run: |
          Push-Location valdi
          & $env:BAZEL_BIN aquery 'deps(//:valdi_runtime_android)' --config=stable_exec --repo_env=VALDI_PLATFORM_DEPENDENCIES=android --output=jsonproto --noinclude_artifacts --noinclude_commandline > ../.ci/windows-actions.json
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit $code }
          node scripts/verify-runtime-actions.mjs .ci/windows-actions.json
          exit $LASTEXITCODE
      - name: Upload Windows build evidence and APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-windows-android-${{ github.run_id }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .ci/
            android/app/build/outputs/apk/debug/*.apk
