steps:
  - run: home
  # Scroll past the last rows first: 路由动画 sits under the bottom tab bar otherwise.
  - scroll-to: { target: { text: "Sheet + 普通 view + 输入框" } }
  - scroll-to: { target: { text: "路由动画" } }
  - tap: { text: "路由动画" }
  - await: { visible: { text: "每个按钮用对应的 options 打开下一页" } }
  - tap: { text: "无动画" }
  # The example page: only it has the caption and 再看一次.
  - await: { visible: { text: "即时切换" } }
  - assert: { visible: { text: "再看一次" } }
  - tap: { text: "返回" }
  - await: { visible: { text: "每个按钮用对应的 options 打开下一页" } }
  - assert: { hidden: { text: "即时切换" } }
