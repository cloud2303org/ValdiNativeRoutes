steps:
  - launch: io.valdiroutes.mediaqa
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: push 详情页
  - scroll-to: { target: { text: 原生视频播放器（MP4 / HLS） } }
  - tap:
      text: 原生视频播放器（MP4 / HLS）
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: video-status
  - tool: await-ui-element
    args:
      condition: text
      selector:
        identifier: video-time
      expectedText: 0.0 / 5.0 秒 · 内嵌
  - tap:
      text: 播放视频
  - tool: await-ui-element
    args:
      condition: text
      selector:
        identifier: video-status
      expectedText: 视频播放中
  - tool: await-ui-element
    args:
      condition: text
      selector:
        identifier: video-time
      expectedText: 5.0 / 5.0
  - tool: await-ui-element
    args:
      condition: text
      selector:
        identifier: video-status
      expectedText: 播放结束
  - tap:
      text: 载入 HLS 示例
  - tool: await-ui-element
    args:
      condition: text
      selector:
        identifier: video-time
      expectedText: / 600.0 秒
      timeoutMs: 30000
  - tap:
      text: 播放视频
  - tap:
      text: 暂停视频
  - tool: await-ui-element
    args:
      condition: text
      selector:
        identifier: video-status
      expectedText: 视频已暂停
