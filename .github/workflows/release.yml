name: Template Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: template-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test source release packaging
        run: node --test scripts/tests/release.test.mjs
      - name: Package the tagged template
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs --ref "$RELEASE_TAG" --out .release
      - name: Publish immutable source archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" .release/* --verify-tag \
            --title "ValdiNativeRoutes $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
