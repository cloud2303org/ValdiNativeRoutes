# Generate the Xcode project with `xcodegen` (brew install xcodegen); ValdiRoutes.xcodeproj is not checked in.
name: ValdiRoutes
options:
  bundleIdPrefix: io.valdiroutes
  deploymentTarget:
    iOS: "16.0"
packages:
  # Image loading for <image> and previewImage, as in ExpoNativeRoutes (Android uses coil).
  SDWebImage:
    url: https://github.com/SDWebImage/SDWebImage.git
    from: 5.21.0
  # api.*StorageSync (StorageHostImpl.swift), as ExpoNativeRoutes' stores. Pinned to v2.4.3's commit: its package uses
  # unsafeFlags, which SwiftPM only allows in a package resolved by revision, not by version.
  MMKV:
    url: https://github.com/Tencent/MMKV.git
    revision: 007a393cd5e255e9aa68d6648f7179159bdf0f9d
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  ValdiRoutes:
    type: application
    platform: iOS
    sources:
      - ValdiRoutes
      # The Valdi bindings of app_pages' native interfaces, generated by hand with tools/valdi-rolldown/codegen.ts and
      # checked in; the "Valdi bindings check" phase fails the build when they're stale. Outside ValdiRoutes, so they
      # count in the over-the-air fingerprint without their comments (scripts/ota.mjs).
      - path: Generated/valdi
        group: ValdiBindings
      # The C++ vision demo shared with Android (OpenCV mobile + ncnn), wrapped by ValdiRoutes/Vision.
      - path: ../vision/cpp
        group: Vision
    dependencies:
      # The Valdi runtime and Valdi's own modules, produced by scripts/export-ios.sh; app_pages comes from the "Valdi
      # modules" phase below, its Objective-C bindings from Generated/valdi.
      - framework: Frameworks/ValdiRuntime.xcframework
        embed: true
      # Static OpenCV mobile + ncnn, prepared by vision/scripts/prepare-native.cjs (git-ignored).
      - framework: ../vision/vendor/install/ios/VisionDependencies.xcframework
        embed: false
        link: true
      - sdk: libc++.tbd
      - package: SDWebImage
      - package: MMKV
    preBuildScripts:
      # Fails when Generated/valdi (Objective-C) or valdi/native/generated (C++) is not what codegen.ts generates from
      # the current TypeScript: a native interface changed without the bindings being regenerated. Only checks;
      # regenerating is done by hand. The C++ is linked into the exported runtime, so it also fails when valdi/native
      # changed since Frameworks/ValdiRuntime.xcframework was exported (scripts/ota.mjs check-export).
      - name: Valdi bindings check
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          command -v node >/dev/null || . "$HOME/.nvm/nvm.sh"
          cd "$SRCROOT/../tools/valdi-rolldown"
          ./node_modules/.bin/tsx codegen.ts --objc-out ../../ios/Generated/valdi --objc-framework ValdiRuntime \
            --cpp-out ../../valdi/native/generated --check
          node ../../scripts/ota.mjs check-export ios "$SRCROOT/Frameworks/valdi_ota.json"
    postCompileScripts:
      # The Valdi modules tools/valdi-rolldown builds (app_pages and the npm packages it bundles) into the app's
      # resources, where the runtime looks before the framework's: JavaScript in Debug, Hermes bytecode and source maps
      # in Release; and app_pages' res/ images as app_pages.bundle.
      - name: Valdi modules
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          command -v node >/dev/null || . "$HOME/.nvm/nvm.sh"
          resources="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          release=""
          if [ "$CONFIGURATION" = "Release" ]; then release="--release"; fi
          # Only ours are here (Valdi's own are in its framework): modules an earlier build wrote and this one doesn't.
          rm -f "$resources"/*.valdimodule "$resources"/*.map.json
          cd "$SRCROOT/../tools/valdi-rolldown"
          ./node_modules/.bin/tsx build.ts --out "$resources" --ios-res "$resources" $release
      # valdi_ota.json (ValdiOta.swift): the app version packages target (MARKETING_VERSION), this binary's fingerprint,
      # the update server (VALDI_OTA_URL, empty turns update checks off) and the key packages are signed with;
      # scripts/export-ios.sh writes the Valdi half of the fingerprint. A Release build with updates on records it as its
      # version's (ota/releases/ios/<version>.json), or fails when that version was released with another (scripts/ota.mjs).
      - name: Valdi over-the-air info
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          command -v node >/dev/null || . "$HOME/.nvm/nvm.sh"
          record=""
          if [ "$CONFIGURATION" = "Release" ] && [ -n "$VALDI_OTA_URL" ]; then record="--record"; fi
          node "$SRCROOT/../scripts/ota.mjs" app-info ios "$SRCROOT/Frameworks/valdi_ota.json" "$MARKETING_VERSION" \
            "$VALDI_OTA_URL" $record > "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/valdi_ota.json"
    info:
      path: ValdiRoutes/Info.plist
      properties:
        UILaunchScreen: {}
        # UIKit app and scene delegates (App.swift); the stack is a UINavigationController.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        CFBundleDisplayName: ValdiRoutes
        # The app version over-the-air packages target (scripts/ota.mjs).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: 用蓝牙连接和配置附近的设备
        NSLocationWhenInUseUsageDescription: 读取当前 Wi-Fi 名称，或以 iBeacon 方式广播时使用定位服务
        NSCameraUsageDescription: 扫描二维码或拍摄附件需要使用相机
        NSPhotoLibraryUsageDescription: 从相册选择要上传的图片
    # As ExpoNativeRoutes' NativeRoutesApp.entitlements: join device hotspots and read the current SSID.
    entitlements:
      path: ValdiRoutes/ValdiRoutes.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
        com.apple.developer.networking.wifi-info: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.valdiroutes.app
        MARKETING_VERSION: "1.0"
        CODE_SIGN_STYLE: Automatic
        # Update server of ValdiOta.swift; empty turns update checks off.
        VALDI_OTA_URL: ""
        # The over-the-air info script reads the repository's sources (ota/fingerprint.json).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: ValdiRoutes/ValdiRoutes-Bridging-Header.h
        # VisionDependencies' simulator slice is arm64 only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # VisionCore, as in ExpoNativeRoutes' NativeRoutesVision.podspec.
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        GCC_ENABLE_CPP_EXCEPTIONS: YES
        GCC_ENABLE_CPP_RTTI: YES
        HEADER_SEARCH_PATHS:
          - $(inherited)
          # <app_pages/app_pages.h>, <app_pagesTypes/app_pagesTypes.h>
          - $(SRCROOT)/Generated/valdi
          - $(SRCROOT)/../vision/cpp
          - $(SRCROOT)/../vision/vendor/install/ios/VisionDependencies.xcframework/ios-arm64/Headers/opencv4
          - $(SRCROOT)/../vision/vendor/install/ios/VisionDependencies.xcframework/ios-arm64/Headers/ncnn
        "HEADER_SEARCH_PATHS[sdk=iphonesimulator*]":
          - $(inherited)
          - $(SRCROOT)/Generated/valdi
          - $(SRCROOT)/../vision/cpp
          - $(SRCROOT)/../vision/vendor/install/ios/VisionDependencies.xcframework/ios-arm64-simulator/Headers/opencv4
          - $(SRCROOT)/../vision/vendor/install/ios/VisionDependencies.xcframework/ios-arm64-simulator/Headers/ncnn
schemes:
  ValdiRoutes:
    build:
      targets:
        ValdiRoutes: all
