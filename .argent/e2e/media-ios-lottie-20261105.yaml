steps:
  - launch: io.valdiroutes.mediaqa
  - await: { visible: { text: push 详情页 }, timeout: 20000 }
  - scroll-to: { target: { text: Lottie 动画 } }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Lottie 动画
      timeoutMs: 20000
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Lottie 动画
      timeoutMs: 20000
  - tap:
      text: Lottie 动画
  - tool: await-ui-element
    args:
      condition: text
      selector:
        identifier: lottie-status
      expectedText: PAUSED · LOADED
