  - await: { visible: { text: "ncnn：" } }
  - await: { visible: { text: "图片：256 × 192" } }
  - await: { visible: { text: "推理输入：64 × 64" } }
  - await: { visible: { text: "OpenCV 处理：" } }
  - await: { visible: { text: "ncnn 推理：" } }
  - await: { visible: { text: "边缘像素：" } }
  - await: { visible: { text: "合成原图" } }
  - scroll-to: { target: { text: "Canny 边缘图" } }
  - await: { visible: { text: "Canny 边缘图" } }
  - scroll-to: { target: { text: "红色通道 R" } }
  - await: { visible: { text: "红色通道 R" } }
  - scroll-to: { target: { text: "绿色通道 G" } }
  - await: { visible: { text: "绿色通道 G" } }
  - scroll-to: { target: { text: "蓝色通道 B" } }
  - await: { visible: { text: "蓝色通道 B" } }
