name: Application CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      valdi_commit:
        description: 'Optional 40-character Valdi fork commit to try (empty = committed pin)'
        type: string
        default: ''
      widgets_tag:
        description: 'Optional Widgets tag, only used with valdi_commit'
        type: string
        default: ''

permissions:
  contents: read

env:
  VALDI_BAZEL_ARGS: '--experimental_disk_cache_gc_max_size=3G'

concurrency:
  group: app-ci-${{ github.event_name }}-${{ github.ref }}-${{ inputs.valdi_commit || 'pinned' }}
  # Let a cold native build finish and populate caches; retain only the newest queued revision.
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    # The iOS vision simulator slice is arm64. Keep host tools on the same supported macOS image.
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [npm, android, ios]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select framework fork commit
        if: inputs.valdi_commit != ''
        env:
          VALDI_COMMIT: ${{ inputs.valdi_commit }}
          WIDGETS_TAG: ${{ inputs.widgets_tag }}
        run: |
          args=("$VALDI_COMMIT")
          if [[ -n "$WIDGETS_TAG" ]]; then args+=("$WIDGETS_TAG"); fi
          node scripts/upstream.mjs pin "${args[@]}"
      - uses: ./.github/actions/prepare
        id: prepare
      - name: Golden and build prerequisite tests
        run: pnpm test 2>&1 | tee .ci/test.log
      - name: Set up Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Install XcodeGen
        if: matrix.target == 'ios'
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Restore Bazel action cache
        id: bazel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel-disk-cache
          key: bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.toolchain }}-${{ matrix.target }}-${{ hashFiles('valdi/.bazelversion') }}-${{ github.sha }}-${{ inputs.valdi_commit || 'pinned' }}
          restore-keys: |
            bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.toolchain }}-${{ matrix.target }}-${{ hashFiles('valdi/.bazelversion') }}-
      - name: Runtime fingerprint
        if: matrix.target != 'npm'
        id: runtime-input
        run: node scripts/ci.mjs runtime-key "${{ matrix.target }}"
      - name: Restore exported runtime
        if: matrix.target != 'npm'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            android/app/libs/valdi_runtime.aar
            android/app/libs/valdi_ota.json
            ios/Frameworks/ValdiRuntime.xcframework
            ios/Frameworks/valdi_ota.json
          key: runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.toolchain }}-${{ matrix.target }}-debug-${{ steps.runtime-input.outputs.key }}-${{ hashFiles('scripts/export-*.sh', 'valdi/pnpm-lock.yaml', 'valdi/patches/**') }}
      - name: Validate cached runtime
        if: matrix.target != 'npm'
        id: runtime
        run: node scripts/ci.mjs runtime-valid "${{ matrix.target }}"
      - name: Export runtime on cache miss or fingerprint mismatch
        if: matrix.target != 'npm' && steps.runtime.outputs.valid != 'true'
        run: sh "scripts/export-${{ matrix.target }}.sh" debug 2>&1 | tee .ci/export.log
      - name: Final runtime fingerprint
        if: matrix.target != 'npm'
        id: runtime-output
        run: node scripts/ci.mjs runtime-key "${{ matrix.target }}"
      - name: Save matching runtime
        if: matrix.target != 'npm' && steps.runtime.outputs.valid != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            android/app/libs/valdi_runtime.aar
            android/app/libs/valdi_ota.json
            ios/Frameworks/ValdiRuntime.xcframework
            ios/Frameworks/valdi_ota.json
          key: runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.toolchain }}-${{ matrix.target }}-debug-${{ steps.runtime-output.outputs.key }}-${{ hashFiles('scripts/export-*.sh', 'valdi/pnpm-lock.yaml', 'valdi/patches/**') }}
      - name: Save Bazel action cache
        if: always() && !cancelled() && steps.bazel-cache.outcome == 'success' && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel-disk-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
      - name: Build application modules
        if: matrix.target == 'npm'
        run: pnpm build 2>&1 | tee .ci/build.log
      - name: Restore vision dependencies
        if: matrix.target != 'npm'
        id: vision
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vision/vendor/install
          key: vision-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.toolchain }}-${{ matrix.target }}-ndk27.1.12297006-${{ hashFiles('vision/vendor-lock.json', 'vision/scripts/prepare-native.cjs') }}
      - name: Build vision dependencies
        if: matrix.target != 'npm' && steps.vision.outputs.cache-hit != 'true'
        env:
          VISION_TARGET: ${{ matrix.target == 'android' && 'android-arm64' || 'ios' }}
        run: node vision/scripts/prepare-native.cjs --target "$VISION_TARGET" 2>&1 | tee .ci/vision.log
      - name: Save prepared vision dependencies
        if: matrix.target != 'npm' && steps.vision.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vision/vendor/install
          key: ${{ steps.vision.outputs.cache-primary-key }}
      - name: Build Android debug APK
        if: matrix.target == 'android'
        run: pnpm build:android --no-daemon --stacktrace 2>&1 | tee .ci/build.log
      - name: Build iOS simulator app
        if: matrix.target == 'ios'
        run: |
          pnpm build:ios 2>&1 | tee .ci/build.log
          tar -czf .ci/ValdiRoutes-simulator.tar.gz -C ios/build/Build/Products/Debug-iphonesimulator ValdiRoutes.app
      - name: Capture upgrade inputs and source review
        if: always()
        run: |
          mkdir -p .ci
          git diff -- valdi/MODULE.bazel valdi/MODULE.bazel.lock valdi/.bazelrc > .ci/upstream-pin.diff
          if [[ -f .ci/upstream/vendor.md ]]; then cat .ci/upstream/vendor.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload build evidence
        if: always()
        id: artifacts
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-${{ matrix.target }}-${{ github.run_id }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .ci/
            android/app/build/outputs/apk/debug/*.apk
      - name: Report unavailable artifacts
        if: always() && steps.artifacts.outcome == 'failure'
        run: |
          echo '::warning::Build evidence upload failed. See the upload step for the storage/quota error; test and build results remain independent.'
          echo 'Artifact upload failed. Logs remain available in the workflow; downloadable APK/App/report artifacts are unavailable for this job. Check the upload step and account storage quota.' >> "$GITHUB_STEP_SUMMARY"
